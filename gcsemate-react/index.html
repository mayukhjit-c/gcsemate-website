  <script>
    // Enhanced tooltip system with smart positioning
    (function () {
      let layer;
      const TOOLTIP_OFFSET = 12;
      const TOOLTIP_MIN_DISTANCE = 8;

      function ensureLayer() {
        if (!layer) {
          layer = document.createElement('div');
          layer.className = 'tooltip-layer';
          document.body.appendChild(layer);
        }
        return layer;
      }

      function positionTooltip(node, content) {
        const l = ensureLayer();
        l.innerHTML = '';
        const tip = document.createElement('div');
        tip.className = 'tooltip';
        tip.textContent = content;
        l.appendChild(tip);

        // Force layout calculation
        tip.style.visibility = 'hidden';
        tip.style.display = 'block';
        const tipWidth = tip.offsetWidth;
        const tipHeight = tip.offsetHeight;
        tip.style.visibility = 'visible';

        const rect = node.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // Calculate available space in each direction
        const spaceAbove = rect.top;
        const spaceBelow = viewportHeight - rect.bottom;
        const spaceLeft = rect.left;
        const spaceRight = viewportWidth - rect.right;

        let x, y;
        let position = 'top'; // default

        // Determine best position: prefer above, then below, then sides
        if (spaceAbove >= tipHeight + TOOLTIP_OFFSET) {
          // Position above
          position = 'top';
          x = rect.left + rect.width / 2 - tipWidth / 2;
          y = rect.top - tipHeight - TOOLTIP_OFFSET;
        } else if (spaceBelow >= tipHeight + TOOLTIP_OFFSET) {
          // Position below
          position = 'bottom';
          x = rect.left + rect.width / 2 - tipWidth / 2;
          y = rect.bottom + TOOLTIP_OFFSET;
        } else if (spaceRight >= tipWidth + TOOLTIP_OFFSET) {
          // Position to the right
          position = 'right';
          x = rect.right + TOOLTIP_OFFSET;
          y = rect.top + rect.height / 2 - tipHeight / 2;
        } else if (spaceLeft >= tipWidth + TOOLTIP_OFFSET) {
          // Position to the left
          position = 'left';
          x = rect.left - tipWidth - TOOLTIP_OFFSET;
          y = rect.top + rect.height / 2 - tipHeight / 2;
        } else {
          // Fallback: position above with adjustments
          position = 'top';
          x = rect.left + rect.width / 2 - tipWidth / 2;
          y = Math.max(TOOLTIP_MIN_DISTANCE, rect.top - tipHeight - TOOLTIP_OFFSET);
        }

        // Ensure tooltip stays within viewport bounds
        x = Math.max(
          TOOLTIP_MIN_DISTANCE,
          Math.min(x, viewportWidth - tipWidth - TOOLTIP_MIN_DISTANCE)
        );
        y = Math.max(
          TOOLTIP_MIN_DISTANCE,
          Math.min(y, viewportHeight - tipHeight - TOOLTIP_MIN_DISTANCE)
        );

        // Ensure tooltip doesn't overlap the hovered element
        if (position === 'top' && y + tipHeight >= rect.top) {
          y = rect.top - tipHeight - TOOLTIP_OFFSET;
        } else if (position === 'bottom' && y <= rect.bottom) {
          y = rect.bottom + TOOLTIP_OFFSET;
        } else if (position === 'right' && x <= rect.right) {
          x = rect.right + TOOLTIP_OFFSET;
        } else if (position === 'left' && x + tipWidth >= rect.left) {
          x = rect.left - tipWidth - TOOLTIP_OFFSET;
        }

        tip.style.position = 'fixed';
        tip.style.left = x + 'px';
        tip.style.top = y + 'px';
        tip.style.zIndex = '10001';
      }

      let currentNode = null;
      let hideTimeout = null;

      document.addEventListener(
        'mouseover',
        e => {
          const t = e.target.closest('[data-tooltip]');
          if (!t) {
            if (layer) layer.innerHTML = '';
            currentNode = null;
            if (hideTimeout) clearTimeout(hideTimeout);
            return;
          }
          if (hideTimeout) clearTimeout(hideTimeout);
          currentNode = t;
          positionTooltip(t, t.getAttribute('data-tooltip'));
        },
        { passive: true }
      );

      document.addEventListener(
        'mouseout',
        e => {
          if (layer && (!currentNode || !currentNode.contains(e.relatedTarget))) {
            hideTimeout = setTimeout(() => {
              if (layer) layer.innerHTML = '';
              currentNode = null;
            }, 100);
          }
        },
        { passive: true }
      );

      window.addEventListener(
        'scroll',
        () => {
          if (currentNode) {
            positionTooltip(currentNode, currentNode.getAttribute('data-tooltip'));
          }
        },
        { passive: true }
      );

      window.addEventListener('resize', () => {
        if (currentNode) {
          positionTooltip(currentNode, currentNode.getAttribute('data-tooltip'));
        }
      });
    })();
  </script>
  <script>
    // Security measures and developer tools detection
    (function () {
      // Check if running in development mode
      const isDev = window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1' || 
                   window.location.hostname.includes('dev') ||
                   window.location.port !== '' && window.location.port !== '80' && window.location.port !== '443';

      // Disable right-click context menu in production
      if (!isDev) {
        document.addEventListener('contextmenu', event => event.preventDefault());
      }

      // Enhanced developer tools detection
      let devtools = false;
      const element = new Image();
      Object.defineProperty(element, 'id', {
        get: function () {
          devtools = true;
          if (!isDev) {
            console.log('DevTools detected. This site is protected.');
            // Additional actions can be added here if needed
          }
          return 'devtools-detected';
        }
      });

      // Check for devtools periodically
      setInterval(() => {
        if (devtools && !isDev) {
          console.log('Developer tools are open. This site is protected.');
        }
        devtools = false;
        console.log(element);
      }, 1000);

      // Disable F12, Ctrl+Shift+I/J/C shortcuts in production
      document.addEventListener(
        'keydown',
        function (e) {
          if (!isDev) {
            // F12
            if (e.key === 'F12') {
              e.preventDefault();
              return false;
            }

            // Ctrl+Shift+I (Inspect)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') {
              e.preventDefault();
              return false;
            }

            // Ctrl+Shift+J (Console)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'J') {
              e.preventDefault();
              return false;
            }

            // Ctrl+Shift+C (Inspect Element)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
              e.preventDefault();
              return false;
            }
          } else {
            // Log available shortcuts in development
            // F12
            if (e.key === 'F12') {
              console.log('F12 pressed - DevTools should open');
            }

            // Ctrl+Shift+I (Inspect)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') {
              console.log('Ctrl+Shift+I pressed - DevTools should open');
            }

            // Ctrl+Shift+J (Console)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'J') {
              console.log('Ctrl+Shift+J pressed - Console should open');
            }

            // Ctrl+Shift+C (Inspect Element)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
              console.log('Ctrl+Shift+C pressed - Inspect Element mode should activate');
            }
          }
        },
        false
      );
    })();
  </script>
